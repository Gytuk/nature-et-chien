<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond carré arrondi crème (comme le logo version 3) -->
  <rect width="64" height="64" rx="14" fill="#f7f4ec"/>

  <!-- Montagne (vert foncé du logo) -->
  <polygon points="32,10 52,42 12,42" fill="#2d5a27" opacity="0.9"/>
  <!-- Sapin simplifié (vert plus clair) -->
  <polygon points="16,42 20,28 24,42" fill="#3d7a35"/>
  <rect x="19" y="40" width="2" height="4" fill="#5a4a18"/>

  <!-- Sol / ligne de terre (brun olive) -->
  <rect x="8" y="42" width="48" height="5" rx="2" fill="#5a4a18" opacity="0.7"/>

  <!-- Silhouette marcheur (blanc simplifié) -->
  <circle cx="37" cy="28" r="3" fill="#f7f4ec"/>
  <line x1="37" y1="31" x2="37" y2="40" stroke="#f7f4ec" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="37" y1="35" x2="33" y2="38" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="35" x2="41" y2="38" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="40" x2="34" y2="44" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="40" x2="40" y2="44" stroke="#f7f4ec" stroke-width="2" stroke-linecap="round"/>

  <!-- Petit chien simplifié -->
  <ellipse cx="46" cy="40" rx="4" ry="2.5" fill="#f7f4ec"/>
  <circle cx="50" cy="38.5" r="2" fill="#f7f4ec"/>
  <line x1="44" y1="42" x2="43" y2="45" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="42" x2="45" y2="45" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="42" x2="49" y2="45" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="51" y2="45" stroke="#f7f4ec" stroke-width="1.5" stroke-linecap="round"/>
</svg>
